[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "position-inference"
version = "0.1.0"
description = "American Football Player Position Inference System V1"
authors = [{ name = "FilmBreakdownAI Team" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "ortools>=9.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
position-inference = "position_inference.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "integration: mark test as integration test",
]

